name: DexHunter alert sahbi

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Sift message test f Telegram"
        type: boolean
        default: true

concurrency:
  group: dexhunter-alert-sahbi
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            state.json
          key: bot2-${{ github.run_id }}
          restore-keys: bot2-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python -u alert.py
        env:
          DEXHUNTER_KEY: ${{ secrets.DEXHUNTER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MIN_ADA: "10000"
          TOKEN_MIN: "NIGHT=100000,STRIKE=50000,SNEK=50000,IAG=50000,USDCX=100000,USDM=100000,USDA=100000,DJED=100000,IUSD=100000,SOLADA=3000,DGENS=3000,BODEGA=3000,CLOVE=3000,SURF=3000"
          COMMANDS: "0"
          POLL_SEC: "30"
          RUN_MINUTES: "345"
          TEST_MODE: ${{ inputs.test || 'false' }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen.json
            state.json
          key: bot2-${{ github.run_id }}
